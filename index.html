<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabecalho">
         <h1 class="titulo">
            meu primeiro formulario
         </h1>
    </header>
    <main id="principal">
        <form id="formulario">
            <h2 class="titulo">Login</h2>
            <div class="caixaCampo">
                 <label for="nomeCampo" class="rotuloCampo">
                    Nome
                 </label>
                 <input type="text" class="campoFormulario" id="nomeCampo" name="nomeCampo" placeholder="digite o seu nome">
            </div>

            <div class="caixaCampo">
                <label for="nomeCampo" class="rotuloCampo">
                   E-mail
                </label>
                <input type="email" class="campoFormulario" id="emailCampo" name="emailCampo" placeholder="digite seu email...">
           </div>

           <div class="caixaCampo">
            <label for="nomeCampo" class="rotuloCampo">
               senha
            </label>
            <input type="password" class="campoFormulario" id="semhaCampo" name="semhaCampo" placeholder="digite sua senha...">
       </div>
       <button id="botaoEnviar">Enviar</button>
        </form>
    </main>
    <footer id="rodape">
          <p>&copy; todos os direitos reservados wesley.s</p>
    </footer>
</body>
</html>
